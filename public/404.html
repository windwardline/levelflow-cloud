<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Levelflow</title>
  <link rel="stylesheet" href="/legal/legal.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      max-width: 32rem;
      padding: 48px 20px;
    }

    .page-eyebrow {
      margin-bottom: 16px;
    }

    h1 {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 32px 0;
      line-height: 1.1;
    }

    .not-found-body {
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-ink);
      margin: 0 0 32px 0;
    }

    .back-link {
      display: inline-block;
      font-size: 15px;
      font-weight: 500;
      color: var(--color-accent);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      padding: 8px 0;
    }

    .back-link:hover {
      color: var(--color-accent-pressed);
    }

    .back-link:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    footer {
      margin-top: 64px;
    }
  </style>
</head>
<body>
  <main>
    <p class="page-eyebrow">Not found</p>
    <h1>Levelflow</h1>
    <p class="not-found-body">This page isn't in this edition.</p>
    <a href="/" class="back-link">Back to Levelflow</a>
  </main>
  <footer>
    <p>A Windward Line production</p>
  </footer>
</body>
</html>
