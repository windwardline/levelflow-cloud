<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One page that reads the market for you: live charts, timing, and only the trade setups that survive review."
    />
    <!--
      Spec §17i, the org standard: "the head carries the full cross-browser set in
      the order Safari and Chrome each need (ICO + sized PNGs + SVG + apple-touch +
      manifest), on the app AND the static pages, so the icon shows in Safari and
      Chrome alike." Order and attributes are both load-bearing, and each line is
      here for one client:

      - favicon.ico FIRST, and with sizes="32x32". Safari does not render SVG
        favicons in any shipping version, so the ICO is the file it resolves to;
        the size attribute is what stops Chrome preferring that ICO over the SVG
        below, which is the whole reason the declared-size trick exists.
      - The sized PNGs are the fallback for anything that reads neither an ICO
        container nor an SVG. They carry the same art, so a client that resolves
        to one of them instead of the ICO looks identical.
      - The dark rendition is for clients that honour `media` on an icon link.
      - favicon.svg LAST, and sizes="any". It is the single theme-adaptive file
        (it carries its own prefers-color-scheme switch, so it is correct in both
        themes on its own), and it wins in Chrome/Firefox/Edge on both available
        signals: scalable by declaration, and last among equals for clients that
        resolve by position. Two SVGs with complementary `media` cannot be ordered
        safely for a client that ignores `media`, which is why the adaptive one is
        the one that ends the list.
      - apple-touch-icon for the iOS home screen, manifest for installed icons.
    -->
    <link rel="icon" href="%BASE_URL%favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%favicon-16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="icon" href="%BASE_URL%favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link
      rel="icon"
      href="%BASE_URL%brand/levelflow-mark-dark.svg?v=2"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg?v=2" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest?v=2" />
    <title>Levelflow — Market review</title>
    <!--
      The card and its copy: spec §17h for the composition, §17f for the words.
      Both strings already exist in the product — the title is this document's own
      <title>, the description is the auth screen's opening line, verbatim — so
      nothing here is a claim the app does not already make. Absolute URLs because
      crawlers do not resolve relative ones.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Levelflow" />
    <meta property="og:title" content="Levelflow — Market review" />
    <meta
      property="og:description"
      content="One page that reads the market for you: live charts, timing, and only the trade setups that survive review."
    />
    <meta property="og:url" content="https://levelflow.windwardline.com/" />
    <meta
      property="og:image"
      content="https://levelflow.windwardline.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Levelflow — market review, daily edition" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
