<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One page that reads the market for you: live charts, timing, and only the trade setups that survive review."
    />
    <!--
      Icon order is load-bearing. Browsers that read `type` prefer the SVG and,
      among equals, take the last one — which is favicon.svg, the single
      theme-adaptive file (it carries its own prefers-color-scheme switch, so it
      is correct in both themes on its own). The dark rendition above it is for
      clients that honour `media` on an icon link; two files with complementary
      media cannot be ordered safely for clients that ignore it, which is why the
      adaptive file is the one that wins by position. The PNGs come first as the
      fallback for anything that cannot rasterise SVG.
    -->
    <link rel="icon" href="%BASE_URL%favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" type="image/png" sizes="32x32" />
    <link
      rel="icon"
      href="%BASE_URL%brand/levelflow-mark-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>Levelflow — Market review</title>
    <!--
      The card and its copy: spec §17h for the composition, §17f for the words.
      Both strings already exist in the product — the title is this document's own
      <title>, the description is the auth screen's opening line, verbatim — so
      nothing here is a claim the app does not already make. Absolute URLs because
      crawlers do not resolve relative ones.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Levelflow" />
    <meta property="og:title" content="Levelflow — Market review" />
    <meta
      property="og:description"
      content="One page that reads the market for you: live charts, timing, and only the trade setups that survive review."
    />
    <meta property="og:url" content="https://levelflow.windwardline.com/" />
    <meta
      property="og:image"
      content="https://levelflow.windwardline.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Levelflow — market review, daily edition" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
