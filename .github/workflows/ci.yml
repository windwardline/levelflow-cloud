name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Manual dispatch exists for one reason, learned on 2026-08-06: GitHub
  # sometimes never CREATES a check suite for a commit. Not a failed run — no
  # run. Two PRs sat unmergeable with `build` required and no way to produce it,
  # because closing and reopening re-fires the event and the event was not what
  # was missing. Re-running a failed run cannot help either; there is nothing to
  # re-run. `security.yml` already had this escape hatch and CI did not, so CI
  # was the one that could not be recovered.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `check` is the project's typecheck entry point (tsc -b --noEmit).
      - name: Run Typecheck
        run: npm run check

      - name: Run Lint
        run: npm run lint

      - name: Check Migrations
        run: npm run check:migrations

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      # Deliberate coverage split: unit/integration tests gate PRs here;
      # the Playwright e2e specs need production credentials and the live
      # Supabase project, so they run in deploy.yml after Edge Functions
      # deploy — the public specs against both a dev server and a local
      # `vite build` artifact, the authed specs against the dev server;
      # never against the Vercel-shipped build itself.
      # Vercel builds and deploys the frontend independently on the same
      # push (README.md), so a failing e2e does not halt or gate it; it
      # fails the deploy workflow run, which is the loud signal.
      - name: Run Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check Bundle Budget
        run: npm run check:bundle
