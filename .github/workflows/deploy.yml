name: Deploy LevelFlow Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VITE_APP_URL: https://levelflow.windwardline.com/
      VITE_BASE_PATH: /
      VITE_DONATION_CASHAPP_URL: ${{ vars.VITE_DONATION_CASHAPP_URL || '' }}
      VITE_DONATION_PAYPAL_URL: ${{ vars.VITE_DONATION_PAYPAL_URL || '' }}
      VITE_DONATION_STRIPE_URL: ${{ vars.VITE_DONATION_STRIPE_URL || '' }}
      VITE_DONATION_URL: ${{ vars.VITE_DONATION_URL || '' }}
      VITE_DONATION_VENMO_URL: ${{ vars.VITE_DONATION_VENMO_URL || '' }}
      VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'false' }}
      VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH || 'false' }}
      SUPABASE_PROJECT_REF: usrtpoftuvhpmyhlhqlg
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_ACCESS_TOKEN LEVELFLOW_PAGES_TOKEN NEWS_SYNC_TOKEN FMP_API_KEY LEVELFLOW_E2E_EMAIL LEVELFLOW_E2E_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"
        env:
          LEVELFLOW_PAGES_TOKEN: ${{ secrets.LEVELFLOW_PAGES_TOKEN }}
          LEVELFLOW_E2E_EMAIL: ${{ secrets.LEVELFLOW_E2E_EMAIL }}
          LEVELFLOW_E2E_PASSWORD: ${{ secrets.LEVELFLOW_E2E_PASSWORD }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          NEWS_SYNC_TOKEN: ${{ secrets.NEWS_SYNC_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: |
          npm run check
          npm run check:migrations
          npm audit --audit-level=high
          npm test

      - name: Run browser tests
        run: npm run test:e2e
        env:
          LEVELFLOW_E2E_EMAIL: ${{ secrets.LEVELFLOW_E2E_EMAIL }}
          LEVELFLOW_E2E_PASSWORD: ${{ secrets.LEVELFLOW_E2E_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Build frontend
        run: |
          npm run build
          npm run check:bundle
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Configure Supabase function secrets
        run: |
          cat > /tmp/levelflow-function-secrets.env <<'EOF'
          APP_ALLOWED_ORIGINS=https://levelflow.windwardline.com,https://windwardline.github.io,http://127.0.0.1:5173,http://localhost:5173
          NEWS_SYNC_TOKEN=${{ secrets.NEWS_SYNC_TOKEN }}
          ECONOMIC_CALENDAR_PROVIDER=${{ vars.ECONOMIC_CALENDAR_PROVIDER || 'fmp' }}
          FMP_API_KEY=${{ secrets.FMP_API_KEY }}
          FMP_API_BASE_URL=${{ secrets.FMP_API_BASE_URL || 'https://financialmodelingprep.com/stable' }}
          FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
          EOF
          npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file /tmp/levelflow-function-secrets.env
          rm -f /tmp/levelflow-function-secrets.env
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Supabase migrations
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is not configured; verified migration files, skipped remote migration apply."
            exit 0
          fi
          npx supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Supabase functions
        run: npx supabase functions deploy market-data trade-analyzer news-calendar --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Publish GitHub Pages artifact
        run: |
          git clone "https://x-access-token:${LEVELFLOW_PAGES_TOKEN}@github.com/windwardline/levelflow-cloud-app.git" /tmp/levelflow-cloud-app
          rsync -a --delete --exclude='.git' --exclude='.github' dist/ /tmp/levelflow-cloud-app/
          cd /tmp/levelflow-cloud-app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish LevelFlow build"
          git push origin main
        env:
          LEVELFLOW_PAGES_TOKEN: ${{ secrets.LEVELFLOW_PAGES_TOKEN }}

      - name: Verify production security headers
        run: |
          headers="$(mktemp)"
          curl -fsSI "https://levelflow.windwardline.com/?v=${GITHUB_SHA}" > "$headers"
          grep -iq "^content-security-policy: .*frame-ancestors 'none'" "$headers"
          grep -iq "^content-security-policy: .*object-src 'none'" "$headers"
          grep -iq "^x-frame-options: DENY" "$headers"
          grep -iq "^x-content-type-options: nosniff" "$headers"
          grep -iq "^referrer-policy: strict-origin-when-cross-origin" "$headers"
          grep -iq "^permissions-policy: .*camera=()" "$headers"
          grep -iq "^cross-origin-opener-policy: same-origin" "$headers"
          rm -f "$headers"
