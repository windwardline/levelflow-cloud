name: Deploy Levelflow Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A deploy that has started finishes. cancel-in-progress severed four deploys
# across two nights (2026-08-05/06), and the cancel can land between `db push`
# and `functions deploy` — database migrated, functions on old code. The
# preflight below recovers the speed the cancel was buying: N rapid merges do
# one real deploy, because a run whose commit is no longer the branch tip
# skips instead of deploying stale code. Skip, not fail — a superseded deploy
# is not an error. tests/securityHardening.test.ts pins both halves.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      superseded: ${{ steps.tip.outputs.superseded }}
    steps:
      - name: Skip when no longer the branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha || true)"
          if [ -z "$tip" ]; then
            # Fail open, loudly: an unreadable tip must not block a deploy,
            # and deploying the triggering commit is the pre-preflight status quo.
            echo "::warning::Could not read the tip of ${GITHUB_REF_NAME}; deploying ${GITHUB_SHA} anyway."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          elif [ "$tip" != "$GITHUB_SHA" ]; then
            echo "${GITHUB_SHA} is no longer the tip of ${GITHUB_REF_NAME} (tip: ${tip}); a later run owns the deploy."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      VITE_APP_URL: https://levelflow.windwardline.com/
      VITE_BASE_PATH: /
      VITE_DONATION_CASHAPP_URL: ${{ vars.VITE_DONATION_CASHAPP_URL || '' }}
      VITE_DONATION_PAYPAL_URL: ${{ vars.VITE_DONATION_PAYPAL_URL || '' }}
      VITE_DONATION_STRIPE_URL: ${{ vars.VITE_DONATION_STRIPE_URL || '' }}
      VITE_DONATION_URL: ${{ vars.VITE_DONATION_URL || '' }}
      VITE_DONATION_VENMO_URL: ${{ vars.VITE_DONATION_VENMO_URL || '' }}
      VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'false' }}
      VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH || 'false' }}
      SUPABASE_PROJECT_REF: usrtpoftuvhpmyhlhqlg
    steps:
      # FMP_API_KEY and NEWS_SYNC_TOKEN are deliberately NOT here and NOT
      # pushed below. The fleet credential law (windwardline/ops: "Keychain
      # is the secret store"; credentials.tsv is the governed inventory)
      # makes the studio Keychain authoritative — and this workflow's copies
      # were the consumers that law's inventory missed: the 2026-08-17
      # rotations propagated to every Keychain-reading consumer with no
      # edit, while the GitHub copies went stale — every deploy overwrote
      # Supabase's good FMP value with the dead key ("Invalid API KEY",
      # runs 373/374), and the news token's gate/caller copies were left
      # behind entirely. Both gate credentials (and the Vault caller copy
      # the pg_cron jobs read) are set ONLY from the Keychain via
      # scripts/ops/sync-function-secrets.sh (run on the studio machine at
      # rotation); they persist across deploys, and the E2E chart gate
      # below plus the script's own authenticated verify call are what
      # prove they work. The secrets that remain here are the PIPELINE's
      # own working credentials — GitHub is their legitimate runtime.
      - name: Check required secrets
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD LEVELFLOW_E2E_EMAIL LEVELFLOW_E2E_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"
        env:
          LEVELFLOW_E2E_EMAIL: ${{ secrets.LEVELFLOW_E2E_EMAIL }}
          LEVELFLOW_E2E_PASSWORD: ${{ secrets.LEVELFLOW_E2E_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run checks
        run: |
          npm run check
          npm run lint
          npm run check:migrations
          npm audit --audit-level=high
          npm test

      # Q3/Q4: this gate used to run after Supabase migrations and Edge
      # Functions had already deployed, so a bundle-budget failure here left
      # the backend shipped with nothing to show for it. It depends on
      # nothing live (VITE_SUPABASE_* are only baked into the client bundle),
      # so it now runs before anything below touches the live project —
      # failing here leaves Supabase exactly as it was before this run.
      - name: Build frontend
        run: |
          npm run build
          npm run check:bundle
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      # Configuration only — no credential travels through this step. The
      # FINNHUB_API_KEY line that used to sit here referenced a GitHub
      # secret that does not exist, so every deploy silently BLANKED any
      # Finnhub value in Supabase (dormant defect — the calendar provider
      # defaults to fmp; found closing the 2026-08-18 key incident). If
      # Finnhub is ever activated, its key joins the Keychain conduit, not
      # this file.
      - name: Configure Supabase function secrets
        run: |
          # FMP_API_BASE_URL is inline, not a secret lookup (#361 round-2
          # doc note): the secrets.FMP_API_BASE_URL it once read never
          # existed, so the expression rendered empty and only the ||
          # default saved it — the exact dead-reference shape that blanked
          # FINNHUB_API_KEY. A host change is an edit to that line,
          # reviewed like any other. (Comment sits OUTSIDE the heredoc so
          # the env file handed to `supabase secrets set` never depends on
          # a dotenv parser skipping comments — #363 review.)
          cat > /tmp/levelflow-function-secrets.env <<'EOF'
          APP_ALLOWED_ORIGINS=https://levelflow.windwardline.com,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5175,http://localhost:5175
          ECONOMIC_CALENDAR_PROVIDER=${{ vars.ECONOMIC_CALENDAR_PROVIDER || 'fmp' }}
          FMP_API_BASE_URL=https://financialmodelingprep.com/stable
          EOF
          npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file /tmp/levelflow-function-secrets.env
          rm -f /tmp/levelflow-function-secrets.env
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Supabase migrations
        run: |
          # --password stays on argv DELIBERATELY (#363 round 2, weighed and
          # declined): the studio argv law exists because ps -ax is
          # world-readable in a multi-process session, and a GitHub-hosted
          # runner is ephemeral and single-tenant — no other user exists to
          # read it. Dropping the flags to lean on the CLI's
          # SUPABASE_DB_PASSWORD env fallback is unverifiable short of a
          # live production deploy, and a wrong guess severs the migrations
          # step mid-deploy.
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Supabase functions
        run: npx supabase functions deploy market-data trade-analyzer news-calendar outcome-sync --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run browser tests
        run: npm run test:e2e
        env:
          LEVELFLOW_E2E_EMAIL: ${{ secrets.LEVELFLOW_E2E_EMAIL }}
          LEVELFLOW_E2E_PASSWORD: ${{ secrets.LEVELFLOW_E2E_PASSWORD }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      # Composition has to be seen, not just asserted (the Stage 3.5 lesson):
      # visual-proof.spec.ts writes full-page captures of every authed
      # surface here, and failures keep their traces for diagnosis.
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-proof
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Vercel builds and deploys the frontend from this repo on push to main
      # (project levelflow-cloud-app). The build gate ran earlier, before any
      # live deploy step; the header check below polls prod, which Vercel
      # updates independently of this workflow.
      - name: Verify production security headers
        run: |
          headers="$(mktemp)"
          for _attempt in $(seq 1 10); do
            curl -fsSI "https://levelflow.windwardline.com/?v=${GITHUB_SHA}" > "$headers" && break
            sleep 30
          done
          grep -iq "^content-security-policy: .*frame-ancestors 'none'" "$headers"
          grep -iq "^content-security-policy: .*object-src 'none'" "$headers"
          # style-src is 'self' plus exactly one content hash — the chart
          # library's attribution stylesheet (docs/security-hardening.md). Never
          # 'unsafe-inline': the hash is what made needing it unnecessary.
          grep -iq "^content-security-policy: .*style-src 'self' 'sha256-" "$headers"
          # A bare `! grep` is inert under this shell's `set -e` (bash -e {0}):
          # the negated pipeline's failure never trips errexit, so the step
          # passed even against a header carrying unsafe-inline. The if-form
          # exits explicitly and was verified to fail on exactly that header.
          if grep -iq "^content-security-policy: .*unsafe-inline" "$headers"; then
            echo "production CSP carries unsafe-inline" >&2
            exit 1
          fi
          grep -iq "^x-frame-options: DENY" "$headers"
          grep -iq "^x-content-type-options: nosniff" "$headers"
          grep -iq "^referrer-policy: strict-origin-when-cross-origin" "$headers"
          grep -iq "^permissions-policy: .*camera=()" "$headers"
          grep -iq "^cross-origin-opener-policy: same-origin" "$headers"
          rm -f "$headers"
