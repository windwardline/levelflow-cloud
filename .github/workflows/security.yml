name: Security analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # weekly: Semgrep, Secret scan, Dependency scan + Headers live
    - cron: "17 13 * * *"  # daily: Dependency scan + Headers live
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ (github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1') }}
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan application and workflow code
        run: semgrep scan --config auto --error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 9 * * 1' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A step, not a job: the gate rides an already-required check, so no
      # ruleset change. Pinned by SHA like every other action — the gate that
      # enforces pinning is itself pinned; Dependabot carries version bumps.
      - uses: windwardline/windwardline/actions/verify-action-pins@6c8d5dac0940af3adb5ace7e625a9cc62020d305 # v1.1.0

  dependency-scan:
    name: Dependency scan
    # No schedule guard, deliberately. Semgrep and Secret scan read repo
    # content, which cannot change without a push, and both already run on
    # every push and pull request — their weekly cron is enough. This job
    # reads the advisory database, which changes with no commit at all:
    # nanoid GHSA-2v37-7h3g-55p8 widened on 2026-08-13 and the weekly scan
    # did not look again until the 17th. So it runs on every trigger.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
      fail-on-vuln: true
      upload-sarif: false
    permissions:
      actions: read
      contents: read
      security-events: write

  headers-live:
    name: Headers live
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: windwardline/windwardline/actions/verify-live-headers@6c8d5dac0940af3adb5ace7e625a9cc62020d305 # v1.1.0
        with:
          url: https://levelflow.windwardline.com
