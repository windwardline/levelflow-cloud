version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # One version group and one security group: one lockfile PR per run per
    # kind. Split groups opened two PRs that rewrote pnpm-lock.yaml from one
    # base; both auto-merged and git's text merge broke main (pathfinder
    # #111/#112, 2026-09-21). Majors stay individual PRs — the auto-merge lane
    # holds them for a human, and inside the group one would hold every patch.
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
